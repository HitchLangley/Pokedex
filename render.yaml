# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repository. Values marked `sync: false` are asked for on creation.
services:
  - type: web
    name: pokedex
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Postgres connection string, e.g. from neon.tech (free)
      - key: PUBLIC_URL
        sync: false # e.g. https://pokedex-xxxx.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: VITE_REPO_URL
        value: https://github.com/HitchLangley/Pokedex
